pagebound:
  data-dir: ./data
  anonymous-read: true
  upload:
    max-file-size: 50MB
  trash:
    retention-days: 30
  site:
    base-url: ""   # 비우면 접속 주소. 리버스 프록시 뒤라면 외부 주소 (MCP 영구 링크용)

springdoc:
  api-docs:
    path: /api/docs
  paths-to-match: /api/v1/**

spring:
  application:
    name: pagebound-server
  datasource:
    url: jdbc:sqlite:${pagebound.data-dir}/pagebound.db?foreign_keys=true&journal_mode=WAL&busy_timeout=5000
    hikari:
      maximum-pool-size: 4
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
