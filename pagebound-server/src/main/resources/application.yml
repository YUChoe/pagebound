pagebound:
  data-dir: ./data
  anonymous-read: true
  upload:
    max-file-size: 50MB

spring:
  application:
    name: pagebound-server
  datasource:
    url: jdbc:sqlite:${pagebound.data-dir}/pagebound.db?foreign_keys=true&journal_mode=WAL&busy_timeout=5000
    hikari:
      maximum-pool-size: 4
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
